<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pool Stats · Session Results</title>
<meta name="description" content="Anonymous live audience results from Matt Burleson's conference sessions for public entity risk pool staff."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--ink:#0f172a;--ink-2:#334155;--muted:#64748b;--line:#e2e8f0;--accent:#0e7490;}
@media (prefers-color-scheme: dark){:root{--bg:#020617;--surface:#0b1424;--ink:#e2f4ff;--ink-2:#b6cde0;--muted:#7d97ad;--line:#1c2c44;--accent:#67e8f9;color-scheme:dark;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.6;}
main{max-width:720px;margin:0 auto;padding:64px 20px;}
.eyebrow{font-family:'Share Tech Mono',monospace;letter-spacing:.22em;text-transform:uppercase;font-size:.8rem;color:var(--accent);}
h1{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em;margin:10px 0 8px;}
p{color:var(--ink-2);}
a.card{display:block;margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;text-decoration:none;color:var(--ink);}
a.card:hover,a.card:focus-visible{border-color:var(--accent);}
a.card h2{font-size:1.15rem;font-weight:700;}
a.card span{display:block;color:var(--muted);font-size:.92rem;margin-top:4px;}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Pool Stats</div>
  <h1>Session results</h1>
  <p>Anonymous, live audience results from conference sessions for public entity risk pool staff.</p>
  <a class="card" href="nlc-risc-2026/">
    <h2>AI Control Room · NLC-RISC 2026</h2>
    <span>How pool staff voted on real-world AI scenarios and the building blocks of an AI policy. October 27, 2026.</span>
  </a>
</main>
</body>
</html>
